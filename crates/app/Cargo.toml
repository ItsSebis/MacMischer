[package]
name = "macmischer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xair-core.workspace = true
xair-proto.workspace = true
eframe.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
xair-mock.workspace = true
xair-remote.workspace = true
qrcode = { version = "0.15", default-features = false }
serde.workspace = true
toml.workspace = true
directories.workspace = true
midir = { version = "0.11", optional = true }
ureq.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["midi"]
# MIDI controller input (needs CoreMIDI on macOS, ALSA headers on Linux).
midi = ["dep:midir"]

# macOS .app bundle: `cargo install cargo-bundle && cargo bundle --release -p macmischer`
[package.metadata.bundle]
name = "MacMischer"
identifier = "de.adiwidjaja.macmischer"
category = "public.app-category.music"
short_description = "Keyboard-first controller for Behringer X Air mixers"
icon = ["assets/icon/icon.svg"] # paths are relative to where `cargo bundle` runs (repo root)

[package.metadata.bundle.osx]
minimum_system_version = "11.0"
info_plist_exts = ["assets/macos-info.plist"]

# Menu-bar / system-tray icon that keeps the app (and web remote) alive after the window closes.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.27", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false }
