[package]
name = "macmischer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xair-core.workspace = true
xair-proto.workspace = true
eframe.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
xair-mock.workspace = true
xair-remote.workspace = true
qrcode = { version = "0.15", default-features = false }
serde.workspace = true
toml.workspace = true
directories.workspace = true
midir = { version = "0.11", optional = true }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"

[features]
default = ["midi"]
# MIDI controller input (needs CoreMIDI on macOS, ALSA headers on Linux).
midi = ["dep:midir"]

# macOS .app bundle: `cargo install cargo-bundle && cargo bundle --release -p macmischer`
[package.metadata.bundle]
name = "MacMischer"
identifier = "de.adiwidjaja.macmischer"
category = "public.app-category.music"
short_description = "Keyboard-first controller for Behringer X Air mixers"
icon = ["assets/icon/icon.svg"] # paths are relative to where `cargo bundle` runs (repo root)

[package.metadata.bundle.osx]
minimum_system_version = "11.0"
info_plist_exts = ["assets/macos-info.plist"]
