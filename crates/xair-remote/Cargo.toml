[package]
name = "xair-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

# Built-in web remote: serves a mobile page + WebSocket that controls selected strips.
[dependencies]
xair-core.workspace = true
xair-proto.workspace = true
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.15"

[dev-dependencies]
xair-mock.workspace = true
toml.workspace = true
tokio-tungstenite = "0.30"
