[workspace]
resolver = "2"
members = ["crates/xair-proto", "crates/xair-core", "crates/xair-mock", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
xair-proto = { path = "crates/xair-proto" }
xair-core = { path = "crates/xair-core" }
xair-mock = { path = "crates/xair-mock" }
rosc = "0.11"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
