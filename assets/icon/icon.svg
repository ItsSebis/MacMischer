<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- MacMischer app icon: three faders on a dark console tile. Source of truth; PNGs are generated
       with `cargo run -p icon-gen`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#16171a"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <!-- tracks -->
  <g fill="#0e0f11">
    <rect x="276" y="220" width="40" height="584" rx="20"/>
    <rect x="492" y="220" width="40" height="584" rx="20"/>
    <rect x="708" y="220" width="40" height="584" rx="20"/>
  </g>
  <!-- level fill below each cap -->
  <g fill="#4cc2ff" opacity="0.55">
    <rect x="276" y="560" width="40" height="244" rx="20"/>
    <rect x="492" y="360" width="40" height="444" rx="20"/>
    <rect x="708" y="480" width="40" height="324" rx="20"/>
  </g>
  <!-- caps -->
  <g fill="#e6e6e6">
    <rect x="216" y="516" width="160" height="88" rx="26"/>
    <rect x="432" y="316" width="160" height="88" rx="26"/>
    <rect x="648" y="436" width="160" height="88" rx="26"/>
  </g>
  <g fill="#4cc2ff">
    <rect x="236" y="552" width="120" height="16" rx="8"/>
    <rect x="452" y="352" width="120" height="16" rx="8"/>
    <rect x="668" y="472" width="120" height="16" rx="8"/>
  </g>
</svg>
